<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Hệ Thống Hóa Đơn Petrolimex POVINA</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(135deg, #1e40af 0%, #2563eb 100%);
            padding: 32px 24px;
            color: #ffffff;
            text-align: center;
        }
        .login-header i {
            font-size: 40px;
            color: #f59e0b;
        }
        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 0.2rem rgba(37, 99, 235, 0.15);
        }
        .btn-login {
            background: linear-gradient(135deg, #1e40af 0%, #2563eb 100%);
            border: none;
            padding: 12px;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.2s ease;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
            transform: translateY(-1px);
        }
        .security-badge {
            font-size: 0.75rem;
            color: #64748b;
            text-align: center;
            margin-top: 16px;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <i class="fa-solid fa-gas-pump mb-2"></i>
        <h5 class="fw-bold mb-0">HÓA ĐƠN PETROLIMEX</h5>
        <div class="small opacity-75 mt-1">CÔNG TY CỔ PHẦN THÉP POVINA</div>
    </div>

    <div class="p-4">
        {% if error %}
        <div class="alert alert-danger py-2 small d-flex align-items-center" role="alert">
            <i class="fa-solid fa-circle-exclamation me-2"></i>
            <div>{{ error }}</div>
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="mb-3">
                <label class="form-label small fw-bold text-secondary">Tên tài khoản</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" name="username" class="form-control border-start-0" placeholder="Nhập tài khoản" required autofocus value="{{ username or '' }}">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold text-secondary">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" name="password" class="form-control border-start-0" placeholder="Nhập mật khẩu" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-login w-100 shadow-sm text-white">
                <i class="fa-solid fa-right-to-bracket me-1"></i> Đăng Nhập
            </button>
        </form>

        <div class="security-badge">
            <i class="fa-solid fa-shield-halved text-success me-1"></i>
            Xác thực bảo mật mã hóa chuẩn PBKDF2-SHA256 (600.000 Rounds)
        </div>
    </div>
</div>

</body>
</html>
